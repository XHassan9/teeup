*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

header{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:14px}

h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.01em}.sub{color:var(--mut);font-size:12px}

.mock{background:#fff7e0;color:#7a5b00;font-size:11px;padding:6px 16px;text-align:center;border-bottom:1px solid #f0e0a8}

// ---- Admin (John + Xander) and the fix button
const ADMH='477c7a782afc393c454a20cd5303172d86d5d5aabf5240fc69430bc6bdfe060b';
async function orgUnlock(){const v=(document.getElementById('pin').value||'').trim();let ok=false;
 try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('teeup-tsg|'+v));ok=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')===ADMH}catch(e){}
 S.org=ok;S.pxMsg=ok?'':'That PIN did not match.';save();draw()}
function fixMe(auto){const keep={me:S.me,meSet:S.meSet,cfg:S.cfg,org:S.org,tab:S.tab};
 try{localStorage.removeItem(KEY)}catch(e){}
 try{localStorage.setItem(KEY,JSON.stringify(Object.assign(mk(),keep,{scores:{}})))}catch(e){}
 const go=()=>{location.href=location.pathname+location.search+(auto?'':'#fixed')};
 const jobs=[];if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(r=>Promise.all(r.map(x=>x.update().catch(()=>{})))).catch(()=>{}));
 if(window.caches)jobs.push(caches.keys().then(k=>Promise.all(k.map(x=>caches.delete(x)))).catch(()=>{}));
 Promise.all(jobs).then(go,go);setTimeout(go,2500)}
function fixAll(){if(!confirm("Tell every phone to refresh and reload the scores from the live board? Nobody's scores are lost."))return;pub({t:'fix'});notify('grp','🛠 Sent. Every open phone will refresh in a few seconds.',true)}
function fixCard(){return`<div class="card"><h2>🛠 App acting up?</h2><div class="mut" style="margin-bottom:8px">Scores missing, stuck screen, or the board looks wrong? One tap refreshes the app and reloads every score from the live board. Nothing you entered is lost.</div><button class="btn" onclick="fixMe()">🛠 Fix the app</button></div>`}
function adminLive(){const n=P().reduce((a,p)=>a+thru(p),0);
 return`<div class="card" style="border:2px solid #c9a24a"><h2>📡 Live round · ${ROUND}</h2><div class="row"><span>Live board</span><b>${SYNC==='on'?'🟢 Connected':'🟠 Reconnecting'}</b></div><div class="row"><span>Scores in</span><b>${n} of ${P().length*18}</b></div><div class="row"><span>Waiting to send from this phone</span><b>${OUTQ.length}</b></div>
 <button class="btn" style="margin-top:8px" onclick="go('sc')">✏️ Correct a score</button>
 <button class="btn alt" style="margin-top:8px" onclick="fixMe()">🛠 Fix this phone</button>
 <button class="btn alt" style="margin-top:8px" onclick="fixAll()">🛠 Fix everyone's phones</button>
 <button class="btn alt" style="margin-top:8px;color:#b3121a" onclick="pubReset()">🔄 Start a fresh round (clears all scores)</button>
 <div class="src" style="margin-top:6px">Corrections you make are sent to every phone and override what the group posted.</div></div>`}
if(location.hash==='#admin'){S.tab='og'}
if(location.hash==='#fixed'){setTimeout(()=>notify('grp','✅ App refreshed — scores reloaded from the live board.',true),900);history.replaceState(null,'',location.pathname+location.search)}

// ---- Add-to-Home-Screen helper (iPhone first, Android one-tap)
let BIP=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();BIP=e;if(typeof draw==='function')draw()});
window.addEventListener('appinstalled',()=>{BIP=null;S.instDone=true;save();draw()});
const UA=navigator.userAgent,IOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),
 INAPP=/FBAN|FBAV|Instagram|Line\/|GSA\/|LinkedInApp|Twitter/.test(UA),CRIOS=/CriOS/.test(UA),OTHER_IOS=/FxiOS|EdgiOS|OPiOS/.test(UA),ANDROID=/Android/.test(UA),
 STANDALONE=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function installCard(){if(STANDALONE()||S.instHide===ROUND+'|'+new Date().getHours())return'';
 const big='font-size:18px;line-height:1.5',step=(n,t)=>`<div style="display:flex;gap:12px;align-items:flex-start;margin:10px 0;${big}"><span style="flex:none;width:34px;height:34px;border-radius:50%;background:var(--mar);color:#fff;font:800 18px 'Fira Sans';display:flex;align-items:center;justify-content:center">${n}</span><span>${t}</span></div>`;
 const share='<span style="display:inline-block;border:2px solid #0a64d6;color:#0a64d6;border-radius:6px;padding:0 6px;font-weight:800">⬆︎ Share</span>';
 let body;
 if(IOS&&INAPP)body=step(1,'Tap the <b>•••</b> or <b>compass</b> button and choose <b>Open in Safari</b>.')+step(2,'Then follow the steps that show up there.');
 else if(IOS&&OTHER_IOS)body=step(1,'Copy this link and open it in <b>Safari</b> (the blue compass app).')+`<div class="src">xhassan9.github.io/teeup</div>`;
 else if(IOS&&CRIOS)body=step(1,`Tap ${share} at the <b>top right</b>, next to the web address.`)+step(2,'Scroll down and tap <b>Add to Home Screen</b>.')+step(3,'Tap <b>Add</b>. Then open the app from your home screen.');
 else if(IOS)body=step(1,`Tap ${share} at the <b>bottom</b> of the screen.`)+step(2,'Scroll down and tap <b>Add to Home Screen</b> ➕.')+step(3,'Tap <b>Add</b> (top right). Then open <b>Sunday Group</b> from your home screen.');
 else if(BIP)body=`<button class="btn" style="font-size:18px;padding:16px" onclick="BIP.prompt();BIP.userChoice.finally(()=>{BIP=null;draw()})">📲 Install the app</button><div class="src" style="margin-top:6px">One tap. It goes on your home screen like any other app.</div>`;
 else if(ANDROID)body=step(1,'Tap the <b>⋮</b> menu at the top right of Chrome.')+step(2,'Tap <b>Add to Home screen</b> or <b>Install app</b>.')+step(3,'Tap <b>Install</b>. Then open <b>Sunday Group</b> from your home screen.');
 else return'';
 return`<div class="card" style="border:2px solid #c9a24a;background:#fffaf0"><h2 style="font-size:17px">📲 Put the app on your phone — 30 seconds</h2>${body}
 <div class="src" style="margin-top:8px">${IOS?'Doing this also lets your phone buzz when your group posts a score.':'It opens full screen with its own icon.'}</div>
 <button class="btn alt" style="margin-top:8px" onclick="S.instHide=ROUND+'|'+new Date().getHours();save();draw()">Not now</button></div>`}

function draw(){const V={lb:vLB,sk:vSK,kp:vKP,sc:vSC,mo:vMO,co:vCO,px:vPX,ph:vPH,sd:vSD,ru:vRU,st:vST,gm:vGM,mr:vMR,sb:vSB,nt:vNT,me:vME,bc:vBC,og:vOG,ab:vAB,tv:vTV};if(!V[S.tab])S.tab='lb';const par=PARENT[S.tab];document.body.classList.toggle('tvm',S.tab==='tv');head();ticker();if(LIVE)setSync(SYNC);
 document.getElementById('app').innerHTML=(LIVE&&S.tab!=='og'?installCard():'')+(LIVE&&!S.meSet&&S.tab!=='og'?whoCard():'')+(par?`<button class="back" onclick="go('${par}')">← Back to ${par==='gm'?'Games':'More'}</button>`:'')+V[S.tab]();
 const bub={gm:S.bets.filter(b=>b.st==='open').length,mr:PH.filter(p=>p.st==='pending').length};
 document.getElementById('nav').innerHTML=NAV.map(t=>`<button class="${(par||S.tab)===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[1]}</b>${t[2]}${bub[t[0]]?`<span class="nb">${bub[t[0]]}</span>`:''}</button>`).join('')}
addEventListener('resize',()=>{if(S.tab==='sc')draw()});draw();
